name: Deploy GitHub Pages

on:
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect site project
        id: site
        shell: bash
        run: |
          has_build_script() {
            grep -q '"build"[[:space:]]*:' "$1/package.json"
          }

          if [ -f site/package.json ] && has_build_script site; then
            echo "app_dir=site" >> "$GITHUB_OUTPUT"
            echo "artifact_path=site/dist" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ] && has_build_script .; then
            echo "app_dir=." >> "$GITHUB_OUTPUT"
            echo "artifact_path=dist" >> "$GITHUB_OUTPUT"
          else
            echo "app_dir=" >> "$GITHUB_OUTPUT"
            echo "artifact_path=dist" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.site.outputs.app_dir != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.site.outputs.app_dir != ''
        working-directory: ${{ steps.site.outputs.app_dir }}
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build site
        if: steps.site.outputs.app_dir != ''
        working-directory: ${{ steps.site.outputs.app_dir }}
        run: npm run build

      - name: Create temporary placeholder
        if: steps.site.outputs.app_dir == ''
        shell: bash
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>AI Starter Skill Pack</title>
            </head>
            <body>
              <main>
                <h1>AI Starter Skill Pack</h1>
                <p>The GitHub Pages pipeline is ready. The Astro site can replace this placeholder.</p>
              </main>
            </body>
          </html>
          HTML

      - name: Verify Pages artifact
        shell: bash
        run: test -f "${{ steps.site.outputs.artifact_path }}/index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.artifact_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
